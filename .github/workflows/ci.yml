name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: engine (the body, the breath, the protocol)
        working-directory: engine
        run: uv run --python 3.12 pytest -q
      - name: server (MCPL, against a fake engine)
        working-directory: server
        run: |
          npm ci
          npm test
      - name: the whole chain, against the real body
        working-directory: server
        run: npm run live
