<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wuji, watching</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22none%22 stroke=%22%23ddd6c8%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="viewer.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<header id="title">
  <h1>wuji <span class="han">無極</span></h1>
  <p id="status">waiting for the body…</p>
</header>

<aside id="body-panel" class="panel">
  <section>
    <h2>Weight</h2>
    <div class="split">
      <span class="side" id="w-left">50%</span>
      <div class="split-bar"><div id="w-bar-left"></div><div id="w-bar-right"></div><i></i></div>
      <span class="side" id="w-right">50%</span>
    </div>
    <div class="legend-row"><span>left</span><span>right</span></div>
  </section>
  <section>
    <h2>Effort</h2>
    <div id="regions"></div>
  </section>
  <section class="legend">
    <div class="ramp"></div>
    <div class="legend-row"><span>quiet</span><span>working</span></div>
  </section>
</aside>

<aside id="breath-panel" class="panel">
  <section class="breath-main">
    <svg id="lung" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="lung-rest" cx="60" cy="60" r="30"></circle>
      <circle id="lung-fill" cx="60" cy="60" r="30"></circle>
    </svg>
    <div class="breath-words">
      <div id="phase">—</div>
      <div class="dim"><span id="rate">–</span> breaths/min · <span id="tidal">–</span> L</div>
      <div class="dim" id="pattern">&nbsp;</div>
    </div>
  </section>
  <section class="rows">
    <div class="row"><span class="label">belly</span><div class="diverge"><i id="belly-bar"></i></div><span class="num" id="belly">–</span></div>
    <div class="row"><span class="label">chest</span><div class="diverge"><i id="chest-bar"></i></div><span class="num" id="chest">–</span></div>
    <div class="row"><span class="label">nostril L</span><div class="flow"><i id="nl-bar"></i></div><span class="num" id="nl">–</span></div>
    <div class="row"><span class="label">nostril R</span><div class="flow"><i id="nr-bar"></i></div><span class="num" id="nr">–</span></div>
  </section>
  <section class="vitals">
    <div><span class="label">CO₂</span> <span id="co2">–</span></div>
    <div><span class="label">O₂</span> <span id="o2">–</span></div>
    <div><span id="beat"></span> <span id="heart">–</span></div>
  </section>
  <section class="rows">
    <div class="row"><span class="label">settled</span><div class="flow"><i id="settled-bar" class="calm"></i></div><span class="num" id="settled">–</span></div>
  </section>
</aside>

<script type="module" src="viewer.js"></script>
</body>
</html>
