[project]
name = "wuji"
version = "0.0.1"
description = "The body behind Wuji: a musculoskeletal body that breathes and senses itself, for a Super Intelligence practising qigong."
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mujoco>=3.3",
  "musclemimic-models>=1.0.6",
  "numpy>=1.26",
  "scipy>=1.12",
  "osqp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wuji"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
